server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Correct MIME type so the browser can use streaming wasm compilation.
    types {
        application/wasm wasm;
        text/html html;
        text/css css;
        application/javascript js;
        application/json json;
        text/plain txt;
        image/svg+xml svg;
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm text/plain image/svg+xml;
    gzip_min_length 1024;

    # Hashed assets are immutable; the HTML entry point is not.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
