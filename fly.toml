# Fly.io configuration for the aircraft engine IDE.
# Static site: the simulation runs in the browser; nginx only serves files.
#
# Deploy:   fly deploy --ha          (creates 2 machines in the primary region)
# Scale:    fly scale count 2 --region yyz
app = "aircraftengine"
primary_region = "yyz"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 2
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 500
    hard_limit = 1000

[[http_service.checks]]
  interval = "15s"
  timeout = "3s"
  grace_period = "5s"
  method = "GET"
  path = "/"

[[vm]]
  size = "shared-cpu-1x"
  cpus = 1
  memory = "256mb"
  processes = ["app"]
